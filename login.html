<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — SmartSpaar</title>
  
  <!-- Tailwind for quick prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Nexa Heavy local font -->
  <link rel="stylesheet" href="/nexa-heavy.css">
  
  <style>
    :root { --primary: #1E3A5F; --accent: #95BF39; --accent-2: #0B8C38; }
    .nexa { font-family: 'Nexa Heavy', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  </style>
</head>
<body class="nexa bg-gray-50 text-slate-900 min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl text-[var(--primary)] mb-2">SmartSpaar</h1>
      <p class="text-gray-600">Faça login para acessar sua conta</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Azure Static Web Apps built-in authentication providers -->
      <a href="/.auth/login/aad?post_login_redirect_url=/dashboard" class="flex items-center justify-center space-x-3 bg-[var(--primary)] hover:bg-[var(--primary)]/90 text-white font-medium py-3 px-4 rounded-lg transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M0 0h11v11H0zm13 0h11v11H13zM0 13h11v11H0zm13 0h11v11H13z"/>
        </svg>
        <span>Microsoft</span>
      </a>
      
      <a href="/.auth/login/github?post_login_redirect_url=/dashboard" class="flex items-center justify-center space-x-3 bg-gray-800 hover:bg-gray-700 text-white font-medium py-3 px-4 rounded-lg transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>
      
      <a href="/.auth/login/google?post_login_redirect_url=/dashboard" class="flex items-center justify-center space-x-3 bg-red-600 hover:bg-red-500 text-white font-medium py-3 px-4 rounded-lg transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Google</span>
      </a>
      
      <a href="/.auth/login/twitter?post_login_redirect_url=/dashboard" class="flex items-center justify-center space-x-3 bg-blue-500 hover:bg-blue-400 text-white font-medium py-3 px-4 rounded-lg transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
        </svg>
        <span>Twitter</span>
      </a>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-[var(--primary)] hover:text-[var(--accent-2)] text-sm">
        ← Voltar para página inicial
      </a>
    </div>
  </div>

  <script>
    // Handle redirect parameter from URL
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '/dashboard';
    
    // Update all login links with the redirect parameter
    document.addEventListener('DOMContentLoaded', () => {
      const loginLinks = document.querySelectorAll('a[href*="/.auth/login/"]');
      loginLinks.forEach(link => {
        const url = new URL(link.href);
        url.searchParams.set('post_login_redirect_url', redirectUrl);
        link.href = url.toString();
      });
    });

    // Check if user is already authenticated and redirect
    fetch('/.auth/me')
      .then(response => response.json())
      .then(data => {
        if (data.clientPrincipal && data.clientPrincipal.userId) {
          // User is authenticated, redirect to requested page or dashboard
          window.location.href = redirectUrl;
        }
      })
      .catch(error => {
        // User is not authenticated, stay on login page
        console.log('User not authenticated');
      });
  </script>

</body>
</html>
