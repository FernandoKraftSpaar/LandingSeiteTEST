<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — SmartSpaar</title>
  
  <!-- Tailwind for quick prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Nexa Heavy local font -->
  <link rel="stylesheet" href="/nexa-heavy.css">
  
  <style>
    :root { --primary: #1E3A5F; --accent: #95BF39; --accent-2: #0B8C38; }
    .nexa { font-family: 'Nexa Heavy', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  </style>
</head>
<body class="nexa bg-gray-50 text-slate-900 min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl text-[var(--primary)] mb-2">SmartSpaar</h1>
      <p class="text-gray-600">Faça login para acessar sua conta</p>
    </div>

    <div class="space-y-4">
      <!-- Azure Static Web Apps built-in authentication providers -->
      <a href="/.auth/login/aad?post_login_redirect_url=/dashboard" class="w-full bg-[var(--primary)] hover:bg-[var(--primary)]/90 text-white font-medium py-3 px-4 rounded-lg text-center block transition-colors flex items-center justify-center">
        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.5 12h-2.01v-.01H12V9.5h9.5v-.01c-.26-3.6-2.61-6.62-5.9-7.28V2.2c3.47.63 6.14 3.61 6.4 7.28v.01h2.01V12z"/>
          <path d="M12 23.5v-2.01h.01V12H9.5v9.5h.01c3.6-.26 6.62-2.61 7.28-5.9h.01v2.01H12z"/>
          <path d="M.5 12h2.01v.01H12v2.49H.5v.01c.26 3.6 2.61 6.62 5.9 7.28v.01c-3.47-.63-6.14-3.61-6.4-7.28V12z"/>
          <path d="M12 .5v2.01h-.01V12H14.5V.5h-.01C10.9.76 7.88 3.11 7.22 6.4H7.21V4.39H12z"/>
        </svg>
        Login com Microsoft
      </a>
      
      <a href="/.auth/login/github?post_login_redirect_url=/dashboard" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-medium py-3 px-4 rounded-lg text-center block transition-colors flex items-center justify-center">
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        Login com GitHub
      </a>
      
      <a href="/.auth/login/google?post_login_redirect_url=/dashboard" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-3 px-4 rounded-lg text-center block transition-colors flex items-center justify-center">
        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Login com Google
      </a>
      
      <a href="/.auth/login/twitter?post_login_redirect_url=/dashboard" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-medium py-3 px-4 rounded-lg text-center block transition-colors flex items-center justify-center">
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
          <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
        </svg>
        Login com Twitter
      </a>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-[var(--primary)] hover:text-[var(--accent-2)] text-sm">
        ← Voltar para página inicial
      </a>
    </div>
  </div>

  <script>
    // Check if user is already authenticated and redirect to dashboard
    fetch('/.auth/me')
      .then(response => response.json())
      .then(data => {
        if (data.clientPrincipal && data.clientPrincipal.userId) {
          // User is authenticated, redirect to dashboard
          window.location.href = '/dashboard';
        }
      })
      .catch(error => {
        // User is not authenticated, stay on login page
        console.log('User not authenticated');
      });
  </script>

</body>
</html>
