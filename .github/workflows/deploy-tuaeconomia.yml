name: Deploy Tuaeconomia to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'tuaeconomia/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # ← Atualizar para Node 20 (LTS)
          cache: 'npm'
          cache-dependency-path: tuaeconomia/package-lock.json
      
      - name: Install dependencies
        run: |
          cd tuaeconomia
          npm ci
      
      - name: Build Application
        run: |
          cd tuaeconomia
          npm run build
        env:
          NODE_ENV: production
      
      # ✅ Adicionar validação
      - name: Verify build output
        run: |
          cd tuaeconomia
          ls -la dist/
          test -f dist/index.html || exit 1
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./tuaeconomia/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
